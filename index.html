
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GeminiOS | Smart AI Agent OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #135bec;
      }
      body {
        font-family: 'Space Grotesk', sans-serif;
        overflow: hidden;
        user-select: none;
        background: #0a0c10;
        -webkit-font-smoothing: antialiased;
        color: white;
        touch-action: manipulation;
      }

      .glass {
        background: rgba(15, 18, 25, 0.75);
        backdrop-filter: blur(32px) saturate(200%);
        -webkit-backdrop-filter: blur(32px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .glass-light {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      ::-webkit-scrollbar {
        width: 0px;
        height: 0px;
      }
      
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }

      .bg-decoration {
        position: fixed;
        inset: 0;
        z-index: -2;
        overflow: hidden;
        pointer-events: none;
      }

      .neural-glow {
        filter: drop-shadow(0 0 8px var(--primary));
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      .fade-mask {
        mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
        "framer-motion": "https://esm.sh/framer-motion@^11.11.1"
      }
    }
    </script>
  </head>
  <body>
    <div class="bg-decoration">
      <div class="absolute top-[-20%] right-[-10%] w-[600px] h-[600px] bg-[#135bec]/15 rounded-full blur-[120px]"></div>
      <div class="absolute bottom-[-10%] left-[-20%] w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[100px]"></div>
    </div>
    <div id="root"></div>
  </body>
</html>

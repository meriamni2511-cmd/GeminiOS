
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeminiOS | Pro AI Agent OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #135bec;
      }
      body {
        font-family: 'Space Grotesk', sans-serif;
        overflow: hidden;
        user-select: none;
        background: #101622;
        -webkit-font-smoothing: antialiased;
        color: white;
      }

      /* Dynamic Glassmorphism */
      .glass {
        background: rgba(28, 31, 39, 0.7);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .glass-light {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 0px;
        height: 0px;
      }
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }

      /* Background Decoration */
      .bg-decoration {
        position: fixed;
        inset: 0;
        z-index: -2;
        overflow: hidden;
        pointer-events: none;
      }

      .app-icon-hover {
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .app-icon-hover:active {
        transform: scale(0.92);
      }
      
      .fade-mask {
        mask-image: linear-gradient(to bottom, black 90%, transparent 100%);
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
        "framer-motion": "https://esm.sh/framer-motion@^11.11.1"
      }
    }
    </script>
  </head>
  <body>
    <div class="bg-decoration">
      <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-[#135bec]/20 rounded-full blur-[100px]"></div>
      <div class="absolute bottom-[-10%] left-[-20%] w-[400px] h-[400px] bg-purple-600/10 rounded-full blur-[80px]"></div>
    </div>
    <div id="root"></div>
  </body>
</html>
